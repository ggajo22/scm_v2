name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: scm_v2
        options: >-
          --health-cmd="mysqladmin ping -u root -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 3306:3306

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies for mysqlclient
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config default-libmysqlclient-dev build-essential

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache Poetry
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Install Poetry
        run: python -m pip install poetry

      - name: Install dependencies
        working-directory: ./backend
        run: poetry install

      # Non-blocking for now: the repo carries 244 pre-existing ruff findings
      # (207 of them line-too-long). Gating on them would make CI red from day
      # one, and a permanently-red CI is a CI nobody reads. The findings stay
      # visible in the job log; flip this to blocking once the backlog is
      # cleared, so new code cannot add to it.
      - name: Run ruff check (non-blocking - pre-existing backlog)
        working-directory: ./backend
        continue-on-error: true
        run: poetry run ruff check .

      - name: Run pytest
        working-directory: ./backend
        env:
          # Full dotted path -- local.py passes this straight through to
          # Django's DATABASES["default"]["ENGINE"], which will not accept
          # the bare "mysql" alias.
          DB_ENGINE: django.db.backends.mysql
          DB_NAME: scm_v2
          DB_USER: root
          DB_PASSWORD: root
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DJANGO_DEBUG: 'False'
          DJANGO_SECRET_KEY: test-secret-key-do-not-use-in-production
          DJANGO_ALLOWED_HOSTS: 'localhost,127.0.0.1'
        run: poetry run pytest

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      # Non-blocking for now, same reasoning as the backend ruff step: 17
      # pre-existing errors (unused vars plus react-hooks rules such as
      # set-state-in-effect). Tests and build below ARE blocking -- those
      # pass today, so they can catch regressions immediately.
      - name: Run linter (non-blocking - pre-existing backlog)
        working-directory: ./frontend
        continue-on-error: true
        run: npm run lint

      - name: Run tests
        working-directory: ./frontend
        run: npm run test

      - name: Build
        working-directory: ./frontend
        run: npm run build
