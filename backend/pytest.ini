[pytest]
DJANGO_SETTINGS_MODULE = config.settings.local
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = --cov=accounts --cov-report=term-missing --cov-fail-under=90
markers =
    concurrency: uses transaction=True + real threads against the shared remote test DB (SPEC-ORDER-016 AC-FORCE-023) — do not run concurrently with other pytest processes; select with -m concurrency, deselect with -m "not concurrency"
